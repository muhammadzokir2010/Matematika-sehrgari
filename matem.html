<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika Sehrgari 🧙‍♂️✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 92vh;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4834d4;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #f7f8fc;
        }
        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .bot {
            background: #e4e7eb;
            color: #2d3436;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user {
            background: #0984e3;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #dfe6e9;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #dfe6e9;
            border-radius: 14px;
            outline: none;
            font-size: 15px;
        }
        .chat-input-area input:focus {
            border-color: #6c5ce7;
        }
        .chat-input-area button {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .chat-input-area button:hover {
            background: #4834d4;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span>🧙‍♂️</span> Matematika Sehrgari <span>✨</span>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                Salom! Men Matematika Sehrgariman! 🧙‍♂️✨ Bugun qanday qiziqarli misol yoki masalani birgalikda yechamiz? 🚀
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Misol yoki savolingizni yozing...">
            <button id="sendBtn">Yuborish</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');

        // Yuborish tugmasi bosilganda
        sendBtn.addEventListener('click', handleUserMessage);

        // Enter tugmasi bosilganda
        inputField.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                handleUserMessage();
[09.10.2026 20:07] Muhammadzokir Qori O‘g‘lim: }
        });

        function handleUserMessage() {
            const text = inputField.value.trim();
            if (text === "") return;

            // 1. Foydalanuvchi xabarini chiqarish
            appendMessage(text, 'user');
            inputField.value = "";

            // 2. Botning javobini biroz kutib chiqarish
            setTimeout(() => {
                getBotReply(text);
            }, 600);
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = message ${sender};
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getBotReply(userText) {
            let reply = "";
            const text = userText.toLowerCase();

            if (text.includes("+")) {
                reply = "🍎 Ajoyib misol! Tasavvur qiling, sizda shuncha olma bor va yana shuncha qo'shildi. Hammasi bo'lib nechta bo'ldi? Qani, buni o'zingiz bir sanab ko'ring-chi! 😉";
            } else if (text.includes("-")) {
                reply = "🍬 Qiziqarli savol! Tasavvur qiling, do'stingizga shuncha shirinlik berib yubordingiz. O'zingizda qanchasi qoldi? O'ylab ko'ring-chi! 🚀";
            } else if (text.includes("*") || text.includes("ko'paytir")) {
                reply = "⭐ Ko'paytirish — bu tezlashtirilgan qo'shish! Tasavvur qiling, har bir qutida shunchadan o'yinchoq bor. Hammasini topish uchun nima qilamiz? 🤔";
            } else if (text.includes("/")  text.includes("bo'l")  text.includes("bol")) {
                reply = "🍫 Bo'lish bu — teng taqsimlash! Tasavvur qiling, shuncha shokoladni do'stlaringizga teng bo'lib bermoqchisiz. Har biriga nechchidan tegadi? Qani, fikrlab ko'raylik! 🌟";
            } else {
                reply = "Yaxshi urinish! 🌟 Keling, bu masalaning birinchi qadamini birgalikda topamiz. Nima deb o'ylaysiz, buni yechish uchun nimadan boshlashimiz kerak? 🧙‍♂️";
            }

            appendMessage(reply, 'bot');
        }
    </script>

</body>
</html>
